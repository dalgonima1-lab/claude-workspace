name: 사업 비서 앱 릴리스

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biz-assistant/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 준비 (실행 환경에 내장된 SDK 사용)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - name: 서명키 복호화
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::error::저장소 비밀 KEYSTORE_PASSPHRASE 가 없습니다. Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in keystore/biz-assistant.keystore.enc -out "$RUNNER_TEMP/biz-assistant.jks" -pass pass:"$KEYSTORE_PASSPHRASE"

      - name: 버전 읽기
        id: ver
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "버전 $NAME ($CODE)"

      - name: APK 빌드
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/biz-assistant.jks
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: 산출물 정리
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/biz-assistant-${{ steps.ver.outputs.name }}.apk"
          printf '{"versionName":"%s","versionCode":%s}\n' "${{ steps.ver.outputs.name }}" "${{ steps.ver.outputs.code }}" > out/version.json

      - name: 릴리스 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: 사업 비서 ${{ steps.ver.outputs.name }}
          body: |
            사업 비서 앱 ${{ steps.ver.outputs.name }} (코드 ${{ steps.ver.outputs.code }}).
            앱 안에서 "업데이트"를 누르면 이 파일을 받아 설치합니다.
          files: |
            biz-assistant/android/out/biz-assistant-${{ steps.ver.outputs.name }}.apk
            biz-assistant/android/out/version.json
